[project]
name = "diffcider-mlx"
version = "0.1.0"
description = "Bidirectional Qwen3 diffusion and Shared Yes/No inference in MLX"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub==0.36.2",
    "jinja2>=3.1",
    "mlx>=0.32.3",
    "numpy>=2.2",
    "transformers==4.57.6",
]

[project.optional-dependencies]
benchmark = [
    "torch>=2.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
