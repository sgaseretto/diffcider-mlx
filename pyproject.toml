[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "diffcider-mlx"
version = "0.1.0"
description = "Bidirectional Qwen3 diffusion and Shared Yes/No inference in MLX"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT AND Apache-2.0 AND CC-BY-NC-4.0 AND LicenseRef-WeDLM"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY.md"]
authors = [{name = "Sebastian Gonzalez Aseretto"}]
keywords = ["mlx", "diffusion", "qwen3", "lora"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub==0.36.2",
    "jinja2>=3.1",
    "mlx>=0.32.3",
    "numpy>=2.2",
    "transformers==4.57.6",
]

[project.scripts]
diffcider = "diffcider.cli:main"
diffcider-browser = "diffcider.browser_demo.app:main"
diffcider-export-browser = "diffcider.export_sysone:main"

[project.urls]
Repository = "https://github.com/sgaseretto/diffcider-mlx"
Issues = "https://github.com/sgaseretto/diffcider-mlx/issues"

[project.optional-dependencies]
benchmark = [
    "peft==0.17.1",
    "torch>=2.8",
]
browser-demo = [
    "gradio>=6.0,<7",
    "playwright>=1.55,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["diffcider"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["diffcider/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
# Preserve the user's design-draft pseudocode; it is not executable Python.
exclude = ["examples/alodlm-decider.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
