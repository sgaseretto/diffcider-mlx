<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Flights · Local mock</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202124;background:#fff;font:16px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;gap:32px;padding:18px 42px;border-bottom:1px solid #e3e7eb}.brand{font-size:23px;font-weight:650}.mock{font-size:12px;font-weight:650;letter-spacing:.08em;border-radius:18px;background:#eaf0fc;color:#174ea6;padding:6px 12px}main{max-width:1020px;margin:28px auto;padding:0 24px}h1{font-size:38px;text-align:center;font-weight:500;margin:18px 0 28px}.card{border:1px solid #dadce0;border-radius:14px;padding:24px;box-shadow:0 2px 8px #18334d0a;background:white}.settings{display:flex;gap:18px;margin-bottom:24px}label{display:block;font-size:13px;color:#5f6368}select{padding:10px 28px 10px 12px;border:1px solid #d4d9de;border-radius:6px;font-size:15px;background:white;color:#202124;margin-top:5px}.route{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.field{position:relative}input[type=text],.date-button{width:100%;height:58px;padding:19px 14px 8px;border:1px solid #9aa0a6;border-radius:7px;background:white;color:#202124;font:18px system-ui}.field>label{position:absolute;top:4px;left:14px;z-index:1;background:white;font-size:11px}.date-button{text-align:left;cursor:pointer}button{cursor:pointer;font:15px system-ui}.primary{padding:13px 26px;border:0;border-radius:24px;color:white;background:#1a73e8}.submit-row{display:flex;align-items:center;justify-content:space-between;margin-top:24px}.hotel{display:none;font-size:15px;color:inherit;align-items:center;gap:8px}.hotel input{width:18px;height:18px}.note{color:#66727f;font-size:13px;text-align:center;margin:20px 0}.suggestions{position:absolute;top:61px;background:white;border:1px solid #d7dfe7;border-radius:9px;z-index:4;width:310px;box-shadow:0 8px 24px #14244025}.suggestions button{display:block;border:0;text-align:left;padding:13px 16px;background:white;width:100%;color:#202124}.suggestions button:hover{background:#edf3fc}.error{color:#b3261e;margin:12px 0 0}.result{display:grid;grid-template-columns:1.2fr 2fr 1fr;align-items:center;border:1px solid #dbe1e7;border-radius:12px;padding:22px;margin-top:14px}.result strong{font-size:20px}.muted{color:#68737d;font-size:13px}.price{text-align:right;color:#137333}.summary{background:#e8f0fe;padding:15px 20px;border-radius:10px}.result-heading{display:flex;align-items:center;justify-content:space-between}dialog{border:1px solid #dadce0;border-radius:16px;width:470px;padding:24px;box-shadow:0 20px 70px #182e4140}dialog::backdrop{background:#20212455}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.monthbar button{border:0;background:#edf2f7;border-radius:100%;width:34px;height:34px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week{font-size:12px;color:#67717c;margin-bottom:10px}.days button{height:40px;border:0;border-radius:50%;background:white}.days button:hover{background:#dce9ff}.days button[aria-pressed=true]{background:#1a73e8;color:white}.days button:disabled{color:#ccd0d5;cursor:default}.calendar-footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.selected-date{font-size:13px;color:#4e5965}.skyscanner{background:#eff3f8;color:#05203c}.skyscanner header{background:#05203c;color:white;border:0}.skyscanner h1{text-align:left;font-size:34px;font-weight:650}.skyscanner .brand{color:#fff}.skyscanner .mock{background:#18446b;color:#b7dcff}.skyscanner .primary{border-radius:7px;background:#0062e3}.skyscanner .card{border:0;box-shadow:0 3px 12px #142a4814}.skyscanner .hotel{display:flex}.skyscanner .route{gap:8px}.skyscanner .summary{background:#fff}.skyscanner .result{background:white}.skyscanner .price{color:#05203c}.hotel-results{padding:20px;background:#fff5da;border:1px solid #f2d48c;border-radius:10px;margin-top:18px}
</style>
<header><span class="brand" id="brand">Google Flights</span><span class="mock">LOCAL MOCK · NO BOOKINGS</span><span style="margin-left:auto;font-size:14px">Flights &nbsp; · &nbsp; Mock fares</span></header>
<main><h1 id="heading">Flights</h1><form id="flight-form" class="card">
<div class="settings"><label>Trip type<select id="trip" aria-label="Trip type"><option value="roundtrip">Round trip</option><option value="oneway">One way</option></select></label><label>Travellers<select id="adults" aria-label="Adults"><option value="1">1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option></select></label><label>Cabin class<select id="cabin" aria-label="Cabin class"><option>Economy</option><option>Premium economy</option><option>Business</option></select></label></div>
<div class="route"><div class="field"><label for="origin">Where from?</label><input id="origin" name="origin" type="text" role="combobox" aria-label="Where from?" aria-autocomplete="list" aria-controls="origin-options" aria-expanded="false" value="Zürich" data-airport="ZRH" required autocomplete="off"><div class="suggestions" role="listbox" id="origin-options" hidden></div></div>
<div class="field"><label for="destination">Where to?</label><input id="destination" name="destination" type="text" role="combobox" aria-label="Where to?" aria-autocomplete="list" aria-controls="destination-options" aria-expanded="false" placeholder="Destination" required autocomplete="off"><div class="suggestions" role="listbox" id="destination-options" hidden></div></div>
<div class="field"><label>Departure</label><button type="button" id="departure" class="date-button" aria-label="Departure date: Select date">Select date</button></div></div>
<div class="submit-row"><label class="hotel"><input id="hotel" type="checkbox" checked>Add a place to stay</label><button id="search" class="primary" type="submit">Search flights</button></div><p id="error" class="error" role="status"></p>
</form><p class="note">An offline test fixture. Airport suggestions, schedules, and prices are mock data.</p><section id="results" aria-live="polite"></section></main>
<dialog id="calendar" aria-label="Choose departure date"><div class="monthbar"><button id="previous" type="button" aria-label="Previous month">‹</button><strong id="month"></strong><button id="next" type="button" aria-label="Next month">›</button></div><div class="week"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="days" id="days"></div><div class="calendar-footer"><span class="selected-date" id="selected-date">Select a departure date</span><button type="button" class="primary" id="confirm-date" disabled>Done</button></div></dialog>
<script>
const qs=new URLSearchParams(location.search), scanner=qs.get('site')==='skyscanner';
if(scanner){document.body.classList.add('skyscanner');document.querySelector('#brand').textContent='Skyscanner';document.querySelector('#heading').textContent='Find your next flight';}
document.title=(scanner?'Skyscanner':'Google Flights')+' · Local mock';
const $=id=>document.getElementById(id), airports=[{name:'Zürich',code:'ZRH',country:'Switzerland',alias:'zurich'},{name:'London',code:'LON',country:'United Kingdom',alias:'london'},{name:'Paris',code:'PAR',country:'France',alias:'paris'},{name:'Madrid',code:'MAD',country:'Spain',alias:'madrid'},{name:'New York',code:'NYC',country:'United States',alias:'new york'}];
function closeSuggestions(){for(const id of ['origin','destination']){$(id+'-options').hidden=true;$(id).setAttribute('aria-expanded','false');}}
for(const id of ['origin','destination']){const input=$(id),list=$(id+'-options');
 const suggest=()=>{closeSuggestions();const q=input.value.toLowerCase().trim();list.replaceChildren();
 for(const airport of airports.filter(a=>!q||[a.name.toLowerCase(),a.alias,a.code.toLowerCase()].some(s=>s.includes(q)))){const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.textContent=airport.name+' ('+airport.code+') — '+airport.country;b.onclick=()=>{input.value=airport.name;input.dataset.airport=airport.code;closeSuggestions();};list.append(b);}
 list.hidden=!list.children.length;input.setAttribute('aria-expanded',String(!list.hidden));};
 input.addEventListener('focus',suggest);input.addEventListener('click',suggest);input.addEventListener('input',()=>{delete input.dataset.airport;suggest();});}
document.addEventListener('click',e=>{if(!e.target.closest('.field'))closeSuggestions();});
const todayText=qs.get('today')||new Date().toLocaleDateString('en-CA'),today=new Date(todayText+'T12:00:00');
let month=new Date(today.getFullYear(),today.getMonth(),1),pending=null,departure=null;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function renderCalendar(){ $('month').textContent=month.toLocaleDateString('en-US',{month:'long',year:'numeric'});$('days').replaceChildren();
 for(let i=0;i<month.getDay();i++)$('days').append(document.createElement('span'));
 for(let d=1;d<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();d++){const date=new Date(month.getFullYear(),month.getMonth(),d,12),button=document.createElement('button');button.type='button';button.textContent=d;button.dataset.date=iso(date);button.setAttribute('aria-label',date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}));button.setAttribute('aria-pressed',String(pending===iso(date)));button.disabled=iso(date)<iso(today);button.onclick=()=>{pending=iso(date);$('selected-date').textContent=date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});$('confirm-date').disabled=false;renderCalendar();};$('days').append(button);}}
$('departure').onclick=()=>{closeSuggestions();renderCalendar();$('calendar').showModal();};
$('next').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar();};$('previous').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar();};
$('confirm-date').onclick=()=>{departure=pending;const label=new Date(departure+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});$('departure').textContent=label;$('departure').setAttribute('aria-label','Departure: '+label);$('departure').dataset.date=departure;$('calendar').close();};
$('flight-form').addEventListener('submit',e=>{e.preventDefault();closeSuggestions();$('results').replaceChildren();
 if(!$('origin').dataset.airport||!$('destination').dataset.airport){$('error').textContent='Select an airport from each suggestion list.';return;}
 if(!departure){$('error').textContent='Choose a departure date.';return;}
 $('error').textContent='';const selection={origin:$('origin').dataset.airport,destination:$('destination').dataset.airport,date:departure,trip:$('trip').value,adults:$('adults').value,cabin:$('cabin').value,hotel:scanner&&$('hotel').checked};
 const params=new URLSearchParams(location.search);for(const [k,v] of Object.entries(selection))params.set(k,String(v));history.replaceState(null,'','/search?'+params);
 const root=$('results');root.dataset.search=JSON.stringify(selection);const title=document.createElement('h2');title.textContent='Available flights';root.append(title);
 const summary=document.createElement('p');summary.className='summary';summary.textContent=$('origin').value+' → '+$('destination').value+' · '+(selection.trip==='oneway'?'One way':'Round trip')+' · '+departure+' · '+selection.adults+' adult · '+selection.cabin;root.append(summary);
 const flights=[{airline:'Alpine Air',number:'AL 214',time:'08:15 – 09:10',duration:'1h 55m',price:112},{airline:'Northstar Airways',number:'NS 482',time:'11:40 – 12:45',duration:'2h 05m',price:148},{airline:'CityJet Mock',number:'CJ 706',time:'17:20 – 18:15',duration:'1h 55m',price:174}];
 for(const flight of flights){const card=document.createElement('article');card.className='result';card.dataset.flight=flight.number;card.dataset.date=departure;const airline=document.createElement('div');airline.textContent=flight.airline;const number=document.createElement('div');number.className='muted';number.textContent=flight.number+' · Mock service';airline.append(number);const times=document.createElement('div');const strong=document.createElement('strong');strong.textContent=flight.time;const sub=document.createElement('div');sub.className='muted';sub.textContent=selection.origin+' – '+selection.destination+' · Nonstop · '+flight.duration;times.append(strong,sub);const price=document.createElement('strong');price.className='price';price.textContent='CHF '+flight.price;card.append(airline,times,price);root.append(card);}
 if(selection.hotel){const hotel=document.createElement('aside');hotel.className='hotel-results';hotel.textContent='Accommodation search added: mock London hotels from CHF 92 per night.';root.append(hotel);}
 root.scrollIntoView({block:'start',behavior:'instant'});
});
</script></html>
